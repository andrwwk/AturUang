  // ---- trend chart + month comparison ----
  function trendMonths() {
    const cur = curYm();
    let end = view > cur ? view : cur;
    if (view < shiftYm(end, -5)) end = view;
    return [5, 4, 3, 2, 1, 0].map(k => shiftYm(end, -k));
  }
  function renderTrend() {
    const months = trendMonths();
    const created = D.meta.created ? ymOf(new Date(D.meta.created)) : curYm();
    const data = months.map(ym => {
      const has = monthTx(ym).length > 0;
      const showIncome = has || ym >= created;
      return { ym, spent: sum(monthTx(ym).map(x => x.amt)), income: showIncome ? budgetFor(ym).income : 0 };
    });
    const W = 320, H = 150, top = 18, bottom = 26, slot = (W - 8) / 6;
    const max = Math.max(1, ...data.map(d => Math.max(d.spent, d.income))) * 1.08;
    const y = v => top + (H - top - bottom) * (1 - v / max);
    let out = "";
    data.forEach((d, i) => {
      const x0 = 4 + i * slot, cx = x0 + slot / 2, bw = slot * 0.46, on = d.ym === view;
      const by = y(d.spent), bh = Math.max(d.spent ? 3 : 0, H - bottom - by);
      out += `<g data-ym="${d.ym}"><rect x="${x0}" y="0" width="${slot}" height="${H}" fill="transparent"/>`;
      out += `<rect x="${cx - bw / 2}" y="${H - bottom - bh}" width="${bw}" height="${bh}" rx="5" fill="${on ? "var(--accent)" : "var(--muted)"}" fill-opacity="${on ? 1 : .3}"/>`;
      if (d.income) out += `<line x1="${x0 + 6}" x2="${x0 + slot - 6}" y1="${y(d.income)}" y2="${y(d.income)}" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      if (on && d.spent) out += `<text x="${cx}" y="${Math.max(11, H - bottom - bh - 6)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${esc(rpShort(d.spent))}</text>`;
      out += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10" font-weight="${on ? 800 : 600}" fill="${on ? "var(--ink)" : "var(--muted)"}">${esc(monthName(d.ym, { month: "short" }))}</text></g>`;
    });
    out += `<line x1="4" x2="${W - 4}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>`;
    const svg = $("trendSvg");
    svg.innerHTML = out;
    svg.setAttribute("aria-label", t("sec.trend") + ": " + data.map(d => `${monthShort(d.ym)} ${rp(d.spent)}`).join(", "));

    const prev = shiftYm(view, -1), maxDay = view === curYm() ? now().getDate() : 0;
    const a = windowSum(view, maxDay), bsum = windowSum(prev, maxDay);
    const line = $("cmpLine");
    if (!bsum) { line.innerHTML = `<span style="color:var(--muted)">${esc(t("cmp.none"))}</span>`; return; }
    const p = Math.round((a - bsum) / bsum * 100);
    const cls = p > 0 ? "up" : p < 0 ? "down" : "same";
    const delta = p > 0 ? t("cmp.up", { p }) : p < 0 ? t("cmp.down", { p: -p }) : t("cmp.same");
    const range = maxDay ? t("cmp.range", { d: maxDay }) : "";
    line.innerHTML = `<span class="delta ${cls}">${esc(delta)}</span><span>${esc(t("cmp.line", { delta: "", prev: monthName(prev, { month: "long" }), range }).trim())}</span><span style="color:var(--muted);margin-left:auto" class="num">${esc(t("cmp.vs", { a: rpShort(a), b: rpShort(bsum) }))}</span>`;
  }
  $("trendSvg").addEventListener("click", e => { const g = e.target.closest("[data-ym]"); if (g && g.dataset.ym !== view) { view = g.dataset.ym; renderAll(); } });

  // ---- goals ----
  function renderGoals() {
    const card = $("goalCard"), ts = totalSaved();
    let html = "";
    if (ts.first) html += `<div class="saved-total"><span>${esc(t("goal.savedTotal", { month: monthShort(ts.first) }))}</span><b>${rp(ts.amt)}</b></div>`;
    if (!D.goals.length) {
      card.innerHTML = html + `<div class="empty" style="padding:12px 4px"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONS.goal}</svg>${esc(t("goal.empty"))}<div style="margin-top:12px"><button class="btn" type="button" id="goalEmptyBtn">${esc(t("goal.create"))}</button></div></div>`;
      $("goalEmptyBtn").onclick = openNewGoal;
      return;
    }
    const share = savingsShare();
    html += D.goals.map(g => {
      const s = goalSaved(g), pct = g.target ? Math.min(100, s / g.target * 100) : 0;
      let sub;
      if (s >= g.target) sub = t("goal.done");
      else if (share > 0) sub = t("goal.eta", { month: monthShort(shiftYm(curYm(), Math.ceil((g.target - s) / share))), amt: rpShort(share) });
      else sub = t("goal.noEta");
      return `<button type="button" class="goal" data-g="${esc(g.id)}"><div class="goal-top"><b></b><span>${Math.floor(pct)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><small>${esc(t("goal.progress", { saved: rp(s), target: rp(g.target) }))} · ${esc(sub)}</small></button>`;
    }).join("");
    card.innerHTML = html;
    card.querySelectorAll("[data-g]").forEach(btn => { btn.querySelector("b").textContent = D.goals.find(g => g.id === btn.dataset.g).name; });
  }
  $("goalCard").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) openGoal(b.dataset.g); });
  $("newGoalLink").addEventListener("click", () => openNewGoal());

  function openNewGoal() {
    $("goalName").value = ""; $("goalAmt").value = ""; $("goalErr").textContent = "";
    sheet("sh-goal"); setTimeout(() => $("goalName").focus(), 320);
  }
  $("goalAmt").addEventListener("input", e => { e.target.value = grouped(digits(e.target.value)); });
  $("goalForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("goalName").value.trim(), target = digits($("goalAmt").value);
    if (!name) { $("goalErr").textContent = t("err.goalName"); $("goalName").focus(); return; }
    if (!target) { $("goalErr").textContent = t("err.goalAmt"); $("goalAmt").focus(); return; }
    D.goals.push({ id: "g" + uid(), name, target, deposits: [] });
    save(); closeSheet(); renderAll(); toast(t("toast.goalSaved", { name }));
  });

  let curGoal = null;
  function openGoal(id) {
    curGoal = id;
    $("depAmt").value = ""; $("depErr").textContent = "";
    renderGoalDetail();
    sheet("sh-goal-detail");
  }
  function renderGoalDetail() {
    const g = D.goals.find(x => x.id === curGoal); if (!g) return;
    const s = goalSaved(g), pct = g.target ? Math.min(100, s / g.target * 100) : 0;
    $("gdTitle").textContent = g.name;
    $("gdBig").innerHTML = `<b>${rp(s)}</b><div class="bar"><i style="width:${pct}%"></i></div><small>${esc(t("goal.progress", { saved: Math.floor(pct) + "%", target: rp(g.target) }))}</small>`;
    const share = savingsShare();
    $("depQuick").innerHTML = share ? `<button type="button" data-v="${share}">${esc(t("goal.quick", { amt: rpShort(share) }))}</button>` : "";
    const ul = $("gdList");
    const deps = [...g.deposits].sort((a, b) => b.date.localeCompare(a.date));
    if (!deps.length) { ul.innerHTML = emptyHtml(t("goal.noDeposits")); return; }
    ul.innerHTML = "";
    deps.forEach(d => {
      const li = document.createElement("li");
      li.className = "tx"; li.style.setProperty("--k", "var(--c-tabungan)");
      li.innerHTML = `<span class="ico">${svgI(ICONS.tabungan)}</span><div class="what"><b></b><span></span></div><span class="amt" style="color:var(--accent)">+${rp(d.amt)}</span><button type="button" class="x" aria-label="${esc(t("del"))}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
      li.querySelector("b").textContent = d.fromYm ? t("goal.fromMonth", { month: monthName(d.fromYm) }) : t("goal.manual");
      li.querySelector(".what span").textContent = new Date(d.date + "T00:00:00").toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" });
      armable(li.querySelector(".x"), t("del"), () => {
        g.deposits = g.deposits.filter(x => x !== d);
        save(); renderGoalDetail(); renderAll(); toast(t("toast.depDeleted"));
      });
      ul.appendChild(li);
    });
  }
  $("depAmt").addEventListener("input", e => { e.target.value = grouped(digits(e.target.value)); });
  $("depQuick").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) $("depAmt").value = grouped(+b.dataset.v); });
  $("depForm").addEventListener("submit", e => {
    e.preventDefault();
    const g = D.goals.find(x => x.id === curGoal); if (!g) return;
    const amt = digits($("depAmt").value);
    if (!amt) { $("depErr").textContent = t("err.amt"); $("depAmt").focus(); return; }
    g.deposits.push({ id: uid(), date: isoOf(now()), amt });
    $("depAmt").value = ""; $("depErr").textContent = "";
    save(); renderGoalDetail(); renderAll(); toast(t("toast.deposit", { amt: rp(amt), name: g.name }));
  });
  $("gdDelete").addEventListener("click", () => {
    const g = D.goals.find(x => x.id === curGoal); if (!g) return;
    confirmSheet(t("cf.goalTitle"), t("cf.goalText", { name: g.name }), t("goal.delete"), () => {
      D.goals = D.goals.filter(x => x !== g);
      save(); renderAll(); toast(t("toast.goalDeleted"));
    });
  });

  // ---- put a closed month's leftover into a goal ----
  let pickYm = null;
  function openPick(ym) {
    const amt = savedOf(ym);
    if (!isLocked(ym) || amt <= 0 || depositFrom(ym)) return;
    pickYm = ym;
    $("pickText").textContent = t("pick.text", { amt: rp(amt), month: monthName(ym) });
    $("pickList").innerHTML = D.goals.map(g => `<button type="button" data-g="${esc(g.id)}"><b></b><span>${esc(t("goal.progress", { saved: rpShort(goalSaved(g)), target: rpShort(g.target) }))}</span></button>`).join("");
    $("pickList").querySelectorAll("[data-g]").forEach(b => { b.querySelector("b").textContent = D.goals.find(g => g.id === b.dataset.g).name; });
    sheet("sh-pick");
  }
  $("pickList").addEventListener("click", e => {
    const b = e.target.closest("[data-g]"); if (!b || !pickYm) return;
    const g = D.goals.find(x => x.id === b.dataset.g), amt = savedOf(pickYm);
    if (!g || depositFrom(pickYm) || amt <= 0) return;
    g.deposits.push({ id: uid(), date: isoOf(now()), amt, fromYm: pickYm });
    pickYm = null;
    save(); closeSheet(); renderAll(); toast(t("toast.deposit", { amt: rp(amt), name: g.name }));
  });

  // ---- tips ----
  function renderTips(spent, dl) {
    const b = budgetFor(view), tips = [], total = sumPct(b);
    if (!b.income) tips.push(["warn", t("tip.noIncome")]);
    if (total !== 100) tips.push(["warn", t("tip.pct", { t: total })]);
    for (const c of b.cats) {
      const a = allocOf(c, b), s = spent[c.id] || 0;
      if (c.group === "tabungan" || !a) continue;
      if (s > a) tips.push(["bad", t("tip.over", { cat: catName(c), amt: rp(s - a) })]);
      else if (s / a >= 0.8 && dl > 0) tips.push(["warn", t("tip.near", { cat: catName(c), p: Math.round(s / a * 100), amt: rp(a - s), n: dl, day: rp((a - s) / dl) })]);
    }
    // biggest category increases vs last month (same day-window for the current month)
    const prev = shiftYm(view, -1), maxDay = view === curYm() ? now().getDate() : 0;
    b.cats.filter(c => c.group !== "tabungan").map(c => {
      const a = windowSum(view, maxDay, c.id), p = windowSum(prev, maxDay, c.id);
      return { c, a, p, diff: a - p, pct: p ? Math.round((a - p) / p * 100) : 0 };
    }).filter(r => r.p > 0 && r.diff >= 20000 && r.pct >= 10).sort((x, y) => y.diff - x.diff).slice(0, 2)
      .forEach(r => tips.push(["warn", t("tip.rise", { cat: catName(r.c), p: r.pct, prev: monthName(prev, { month: "long" }), amt: rp(r.diff) })]));

    const mk = b.cats.find(c => c.id === "makan");
    if (mk && b.income && dl > 0) {
      const left = allocOf(mk, b) - (spent.makan || 0);
      if (left > 0) tips.push(["", t("tip.food", { day: rp(left / dl), meal: rp(left / dl / 3) })]);
    }
    const tb = b.cats.find(c => c.id === "tabungan");
    if (tb && b.income && view >= curYm()) tips.push(["", t("tip.save", { amt: rp(allocOf(tb, b)) })]);
    if (b.income && b.income < 3000000 && b.preset === "seimbang") tips.push(["", t("tip.starter")]);
    const hasTx = Object.values(D.tx).some(a => a.length);
    if (hasTx && Date.now() - (D.meta.lastBackup || 0) > 30 * 864e5) tips.push(["", t("tip.backup")]);
    $("tips").innerHTML = tips.slice(0, 5).map(([k, s]) => `<li class="${k}">${esc(s)}</li>`).join("");
  }

  // ================= render: budget =================
  const rowRefs = {};
  function renderBudget() {
    const b = budgetFor(view), editable = canEditBudget(view);
    $("budgetNote").hidden = editable;
    if (!editable) $("budgetNoteText").textContent = isLocked(view)
      ? t("budget.locked", { month: monthName(view) })
      : t("budget.pastGrace", { month: monthName(view), date: graceEndText(view) });
    $("presets").hidden = !editable;
    $("presets").innerHTML = Object.keys(PRESETS).map(k => `<button type="button" role="radio" data-p="${k}" aria-checked="${b.preset === k}">${t("preset." + k)}</button>`).join("");
    $("customTag").hidden = !!PRESETS[b.preset];
    $("presetDesc").textContent = PRESETS[b.preset] ? t("pdesc." + b.preset) : t("budget.customDesc");
    $("addCatForm").hidden = !editable;

    const list = $("catList"); list.innerHTML = "";
    for (const k in rowRefs) delete rowRefs[k];
    for (const c of b.cats) {
      const el = document.createElement("div");
      el.className = "cat"; el.style.setProperty("--k", colorOf(c));
      el.innerHTML = `<span class="ico">${icon(c)}</span>
        <div class="name"><b></b><span></span></div>
        <div class="nom"></div>
        <div class="ctl">
          <input type="range" min="0" max="60" step="1">
          <span class="pct"><input type="number" inputmode="numeric" min="0" max="100">%</span>
          <button type="button" class="del"></button>
        </div>
        <div class="use"><div class="bar"><i></i></div><div class="use-txt"><span class="used"></span><span class="left"></span></div></div>`;
      el.querySelector(".name b").textContent = catName(c);
      el.querySelector(".name span").textContent = `${t("group." + (GROUP_KEYS.includes(c.group) ? c.group : "other"))}${catSub(c) ? " · " + catSub(c) : ""}`;
      const range = el.querySelector("input[type=range]"), num = el.querySelector(".pct input"), del = el.querySelector(".del");
      range.setAttribute("aria-label", catName(c) + " %"); num.setAttribute("aria-label", catName(c) + " %");
      range.value = c.pct; num.value = c.pct;
      del.textContent = t("del");
      if (!editable) { range.disabled = true; num.disabled = true; del.hidden = true; }
      else {
        range.addEventListener("input", () => { c.pct = +range.value; num.value = c.pct; markCustom(); updateBudgetNumbers(); });
        range.addEventListener("change", () => { save(); renderHome(); });
        num.addEventListener("input", () => { c.pct = Math.max(0, Math.min(100, Math.round(+num.value || 0))); range.value = Math.min(60, c.pct); markCustom(); updateBudgetNumbers(); });
        num.addEventListener("change", () => { num.value = c.pct; save(); renderHome(); });
        armable(del, t("sure"), () => {
          D.settings.cats = D.settings.cats.filter(x => x !== c);
          markCustom(); save(); renderAll(); toast(t("toast.catDeleted", { name: catName(c) }));
        });
      }
      rowRefs[c.id] = { el, nom: el.querySelector(".nom"), fill: el.querySelector(".bar i"), used: el.querySelector(".used"), left: el.querySelector(".left") };
      list.appendChild(el);
    }
    updateBudgetNumbers();
  }
  function markCustom() {
    if (!canEditBudget(view) || !PRESETS[D.settings.preset]) return;
    D.settings.preset = "kustom";
    $("customTag").hidden = false;
    $("presets").querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-checked", "false"));
    $("presetDesc").textContent = t("budget.customDesc");
  }
  function updateBudgetNumbers() {
    const b = budgetFor(view), spent = spentBy(), dl = daysLeft(), total = sumPct(b), editable = canEditBudget(view);
    for (const c of b.cats) {
      const r = rowRefs[c.id]; if (!r) continue;
      const a = allocOf(c, b), s = spent[c.id] || 0, ratio = a > 0 ? s / a : (s > 0 ? 2 : 0);
      r.nom.textContent = rp(a);
      r.fill.style.width = Math.min(100, ratio * 100) + "%";
      r.used.textContent = t("row.used", { amt: rp(s) });
      r.left.textContent = s > a ? t("row.over", { amt: rp(s - a) })
        : c.group === "tabungan" ? t("row.setAside", { amt: rp(a - s) })
        : (dl > 0 && a > 0 ? `${t("row.left", { amt: rp(a - s) })} · ${t("row.perDay", { amt: rpShort((a - s) / dl) })}` : t("row.left", { amt: rp(a - s) }));
      r.el.dataset.state = s > a ? "over" : ratio >= .8 ? "warn" : "ok";
    }
    const g = { kebutuhan: 0, keinginan: 0, tabungan: 0 };
    for (const c of b.cats) g[GROUP_KEYS.includes(c.group) ? c.group : "keinginan"] += c.pct || 0;
    const tgt = PRESETS[b.preset] && PRESETS[b.preset].target, denom = Math.max(100, total);
    $("splitStrip").innerHTML = GROUP_KEYS.map(k => `<i style="--k:${GROUP_COLOR[k]};width:${g[k] / denom * 100}%"></i>`).join("");
    $("splitLegend").innerHTML = GROUP_KEYS.map((k, i) => `<span style="--k:${GROUP_COLOR[k]}">${esc(t("group." + k))} <b>${g[k]}%</b>${tgt ? ` / ${tgt[i]}%` : ""}</span>`).join("");
    const pill = $("sumPill");
    if (total === 100) { pill.className = "sum-pill"; pill.innerHTML = `<span>${esc(t("budget.total100"))}</span>`; }
    else {
      pill.className = "sum-pill off";
      const what = total > 100 ? t("budget.excess", { n: total - 100 }) : t("budget.remain", { n: 100 - total });
      pill.innerHTML = `<span>${esc(t("budget.totalOff", { t: total, what }))}</span>` + (editable ? `<button type="button" id="fixSum">${esc(t("budget.fix"))}</button>` : "");
      if (editable) $("fixSum").onclick = () => { fixTo100(); save(); renderAll(); };
    }
  }
  function fixTo100() {
    const cats = D.settings.cats; if (!cats.length) return;
    const target = cats.find(c => c.id === "tabungan") || cats[cats.length - 1];
    target.pct = Math.max(0, target.pct + 100 - sumPct(D.settings));
    let still = 100 - sumPct(D.settings);
    for (const c of [...cats].sort((a, b) => b.pct - a.pct)) { if (still >= 0) break; const take = Math.min(c.pct, -still); c.pct -= take; still += take; }
    markCustom();
  }
  $("presets").addEventListener("click", e => {
    const b = e.target.closest("[data-p]"); if (!b || !canEditBudget(view)) return;
    const key = b.dataset.p;
    const custom = D.settings.cats.filter(c => !(c.id in PRESETS[key].p)).map(c => ({ ...c, pct: 0 }));
    D.settings.preset = key; D.settings.cats = defaultCats(key).concat(custom);
    save(); renderAll(); toast(t("toast.preset", { name: t("preset." + key) }));
  });
  $("addCatForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!canEditBudget(view)) return;
    const name = $("newCat").value.trim(); if (!name) { $("newCat").focus(); return; }
    const used = D.settings.cats.filter(c => c.color).length;
    D.settings.cats.push({ id: "k" + uid(), name, sub: "", group: "keinginan", pct: 0, color: EXTRA_COLORS[used % EXTRA_COLORS.length] });
    $("newCat").value = ""; markCustom(); save(); renderAll(); toast(t("toast.catAdded", { name }));
  });

  // ================= render: history (search & filter) =================
  let hq = "", hall = false;
  const hcats = new Set();
  function filterCats() {
    const seen = new Map();
    for (const c of [...budgetFor(view).cats, ...D.settings.cats]) if (!seen.has(c.id)) seen.set(c.id, c);
    return [...seen.values()];
  }
  function renderHistFilters() {
    $("hFilters").innerHTML = `<button type="button" class="fchip" data-all aria-pressed="${hall}">${esc(t("hist.allMonths"))}</button>` +
      filterCats().map(c => `<button type="button" class="fchip" data-c="${esc(c.id)}" aria-pressed="${hcats.has(c.id)}" style="--k:${colorOf(c)}"><i></i>${esc(catName(c))}</button>`).join("");
  }
  $("hFilters").addEventListener("click", e => {
    const b = e.target.closest(".fchip"); if (!b) return;
    if (b.hasAttribute("data-all")) hall = !hall;
    else { const id = b.dataset.c; hcats.has(id) ? hcats.delete(id) : hcats.add(id); }
    renderHistFilters(); renderHistoryList();
  });
  $("hSearch").addEventListener("input", e => { hq = e.target.value; renderHistoryList(); });

  function renderHistoryList() {
    const box = $("historyList");
    const q = hq.trim().toLowerCase(), qd = String(digits(hq) || "");
    const active = !!(q || hcats.size || hall);
    const source = hall ? Object.values(D.tx).flat() : monthTx();
    const items = source.filter(x => {
      if (hcats.size && !hcats.has(x.cat)) return false;
      if (!q) return true;
      const c = findCat(x.cat, x.date.slice(0, 7));
      return (x.note || "").toLowerCase().includes(q) || (c && catName(c).toLowerCase().includes(q)) || (qd && String(x.amt).includes(qd));
    }).sort((a, b) => b.date.localeCompare(a.date) || (b.t || 0) - (a.t || 0));

    if (!items.length) {
      box.innerHTML = `<div class="card"><ul class="tx-list">${emptyHtml(active ? t("hist.noMatch") : t("hist.empty", { month: monthName(view) }))}</ul></div>`;
      return;
    }
    const total = sum(items.map(x => x.amt));
    box.innerHTML = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span><span class="label">${esc(active ? t("hist.results") : t("hist.total", { month: monthName(view) }))}</span><br><b style="font-size:1.3rem;font-family:var(--f-display)" class="num">${rp(total)}</b></span><span class="badge">${esc(t("hist.count", { n: items.length }))}</span></div>`;
    const byDay = {};
    items.forEach(x => (byDay[x.date] = byDay[x.date] || []).push(x));
    for (const day of Object.keys(byDay)) {
      const wrap = document.createElement("div");
      const d = new Date(day + "T00:00:00");
      const opt = hall ? { weekday: "short", day: "numeric", month: "long", year: "numeric" } : { weekday: "long", day: "numeric", month: "long" };
      wrap.innerHTML = `<div class="day-head"><span>${esc(d.toLocaleDateString(loc(), opt))}</span><span class="num">-${rp(sum(byDay[day].map(x => x.amt)))}</span></div><div class="card" style="padding:4px 14px"><ul class="tx-list"></ul></div>`;
      const ul = wrap.querySelector("ul");
      byDay[day].forEach(x => ul.appendChild(txItem(x, hall)));
      box.appendChild(wrap);
    }
  }
  function renderHistory() { renderHistFilters(); renderHistoryList(); }

  // ================= render: more / storage =================
  function renderStoreInfo() {
    if (!D) return;
    const both = okLS && okIDB && idb;
    $("storeInfo").textContent = both ? t("store.ok2") : (okLS || okIDB) ? t("store.ok1") : t("store.fail");
    const b = $("storeBadge");
    if (!okLS && !okIDB) { b.textContent = t("badge.problem"); b.className = "badge warn"; }
    else { b.textContent = persisted ? t("badge.perm") : t("badge.active"); b.className = "badge"; }
    $("savedAt").textContent = fmtWhen(D._t);
    $("backupAt").textContent = D.meta.lastBackup ? fmtWhen(D.meta.lastBackup) : t("more.never");
    const ts = totalSaved();
    $("savedSince").textContent = ts.first ? t("more.savedSince", { month: monthShort(ts.first) }) : t("more.savedNone");
    $("savedTotalMore").textContent = ts.first ? rp(ts.amt) : "";
  }

  $("exportBtn").addEventListener("click", async () => {
    saveNow();
    const name = `${t("backup.file")}-${isoOf(now())}.json`;
    const file = new File([JSON.stringify(D, null, 2)], name, { type: "application/json" });
    let done = false;
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: t("backup.title") }); done = true; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    if (!done) {
      const url = URL.createObjectURL(file);
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    D.meta.lastBackup = Date.now(); saveNow(); renderStoreInfo(); renderHome();
    toast(t("toast.backup"));
  });
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast(t("toast.badFile")); return; }
    if (!valid(data)) { toast(t("toast.badFile")); return; }
    const n = Object.values(data.tx).reduce((a, x) => a + (Array.isArray(x) ? x.length : 0), 0);
    confirmSheet(t("cf.restoreTitle"), t("cf.restoreText", { date: fmtWhen(data._t), n }), t("cf.restoreOk"), () => {
      D = migrate(data); lang = D.lang;
      ensureSnapshots(); saveNow();
      applyStatic(); renderLangSegs(); greet(); go(tab); renderAll();
      toast(t("toast.restored"));
    });
  });
  $("resetBtn").addEventListener("click", () => {
    confirmSheet(t("cf.resetTitle"), t("cf.resetText"), t("cf.resetOk"), () => {
      D = null; dirty = false; clearTimeout(saveTimer);
      try { localStorage.removeItem(LS_KEY); } catch {}
      idbReady.then(db => { try { if (db) db.transaction("kv", "readwrite").objectStore("kv").delete("data"); } catch {} });
      view = curYm(); tab = "home";
      $("app").hidden = true; $("onboard").hidden = false; $("obIncome").value = ""; renderOnboard();
    });
  });

  // ================= install hint (iOS Safari, not yet on home screen) =================
  function installHint() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
    let dismissed = false; try { dismissed = localStorage.getItem("aturuang:hint") === "1"; } catch {}
    $("installHint").hidden = !(ios && !standalone && !dismissed);
  }
  $("installClose").addEventListener("click", () => { $("installHint").hidden = true; try { localStorage.setItem("aturuang:hint", "1"); } catch {} });

  // ================= boot =================
  function greet() {
    const h = now().getHours();
    $("greet").textContent = t(h < 11 ? "greet.morning" : h < 15 ? "greet.noon" : h < 18 ? "greet.afternoon" : "greet.night");
  }
  function renderAll() {
    $("monthLabel").innerHTML = (isLocked(view) ? LOCK_SVG : "") + esc(monthName(view, { month: "short", year: "numeric" }));
    renderHome(); renderBudget(); renderHistory(); renderStoreInfo();
  }
  function showApp() {
    $("onboard").hidden = true; $("app").hidden = false;
    greet(); installHint(); go(tab); renderAll();
  }

  drawGuilloche();
  applyStatic(); renderLangSegs();
  load().then(d => {
    if (d) {
      const wasV1 = !d.v || d.v < 2;
      D = migrate(d);
      lang = D.lang;
      applyStatic(); renderLangSegs();
      if (ensureSnapshots() || wasV1) saveNow();
      showApp();
      if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { persisted = p; renderStoreInfo(); }).catch(() => {});
      askPersist();
    } else { $("onboard").hidden = false; renderOnboard(); }
  });

  // When the app comes back from the background (maybe on a new day or month), refresh.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && D) { ensureSnapshots(); greet(); renderAll(); }
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
