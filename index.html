<style>
/* Layout: phone-first single column (max 600px) with a banknote-style balance card on top,
   iOS bottom tab bar with a raised "+" and bottom sheets for input. */
:root {
  --bg: #eef3f0;
  --surface: #ffffff;
  --sunk: #e4ece8;
  --ink: #0f1f19;
  --muted: #5c6f67;
  --line: #d9e3de;
  --accent: #0b6b4f;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe2;
  --note-a: #0e7a5a;   /* banknote card gradient */
  --note-b: #053a2b;
  --gold: #e9c46a;
  --gold-ink: #8a6410;
  --ok: #1f7a3d; --warn: #a35c00; --bad: #c0261a;
  --warn-soft: #fbeed7; --bad-soft: #fde3df;
  --bar-bg: rgba(255,255,255,.82);
  --shadow: 0 1px 2px rgba(15,31,25,.06), 0 8px 24px rgba(15,31,25,.06);
  --c-makan: #e0561b; --c-tagihan: #1f6fd6; --c-transport: #6a46d8; --c-hiburan: #d6336c;
  --c-belanja: #c47a00; --c-sosial: #0b8091; --c-darurat: #5b8a0b; --c-tabungan: #0b6b4f;
  --c-x1: #8a5a44; --c-x2: #4c6ef5; --c-x3: #ae3ec9; --c-x4: #5c7080;
  --f-display: "Bricolage Grotesque", ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #07100c; --surface: #111c17; --sunk: #182621; --ink: #e6f0eb; --muted: #94a89f; --line: #22322b;
    --accent: #46cf9f; --accent-ink: #04261b; --accent-soft: #143a2d;
    --note-a: #128a64; --note-b: #04291e; --gold: #f0cf7a; --gold-ink: #f0cf7a;
    --ok: #5fd68a; --warn: #f2b54f; --bad: #ff7b6e; --warn-soft: #362a12; --bad-soft: #3b1916;
    --bar-bg: rgba(17,28,23,.82);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --c-makan: #ff8a4c; --c-tagihan: #5aa2ff; --c-transport: #a18bff; --c-hiburan: #ff6fa3; --c-belanja: #f6b740;
    --c-sosial: #3cc4d6; --c-darurat: #9fd148; --c-tabungan: #46cf9f; --c-x1: #d39a7e; --c-x2: #8aa4ff; --c-x3: #da84ec; --c-x4: #a3b4c2;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overscroll-behavior-y: none; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
input, select { font-size: 16px; }          /* stops iOS zooming into fields */
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--muted); }

.app {
  max-width: 600px; margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.stack { display: flex; flex-direction: column; gap: 16px; }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head h1 { font-size: 1.9rem; font-weight: 800; }
.head .sub { color: var(--muted); font-size: .85rem; }
.month { display: flex; align-items: center; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); padding: 3px; }
.month button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.month button:active { background: var(--sunk); }
.month span { font-weight: 700; font-size: .85rem; min-width: 76px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }

/* banknote card */
.note {
  position: relative; overflow: hidden; border-radius: 26px; padding: 20px 20px 18px; color: #fff;
  background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.14), transparent 55%), linear-gradient(150deg, var(--note-a), var(--note-b));
  box-shadow: 0 18px 40px -18px rgba(5,58,43,.7);
  isolation: isolate;
}
.note svg.guil { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .22; pointer-events: none; }
.note-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.note .label { color: rgba(255,255,255,.75); }
.note .serial { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .68rem; letter-spacing: .14em; color: rgba(255,255,255,.6); }
.note .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.3rem, 10vw, 3.1rem); line-height: 1.05; margin: 6px 0 2px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.note .big small { font-size: .45em; font-weight: 700; opacity: .8; margin-right: 4px; letter-spacing: 0; }
.note .meter { height: 8px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; margin: 14px 0 12px; }
.note .meter i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #fff, var(--gold)); transition: width .4s; }
.note-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note-cols button, .note-cols div { text-align: left; color: #fff; }
.note-cols b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.note-cols .edit { display: inline-flex; gap: 6px; align-items: center; }
.note-cols .edit svg { opacity: .75; }
.note-cols button:disabled .edit svg { display: none; }
.daily { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.18); border-radius: 14px; padding: 10px 12px; font-size: .88rem; min-height: 44px; }
.daily b { margin-left: auto; font-size: 1.05rem; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.daily button { color: var(--gold); font-weight: 800; text-align: left; width: 100%; }
.note.neg .big { color: #ffd2cc; }
.stamp {
  position: absolute; right: 14px; top: 12px; transform: rotate(-8deg);
  border: 3px double rgba(255,255,255,.85); border-radius: 9px; padding: 2px 10px 1px;
  font-family: var(--f-display); font-weight: 800; font-size: .85rem; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(255,255,255,.92); background: rgba(255,255,255,.06); pointer-events: none;
}

/* cards & lists */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 6px 4px -4px; }
.sec h2 { font-size: 1.2rem; font-weight: 700; }
.link { color: var(--accent); font-weight: 700; font-size: .88rem; }
.strip-note { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); border-radius: 16px; padding: 12px 14px; font-size: .88rem; }
.strip-note svg { flex: none; margin-top: 2px; color: var(--warn); }
.strip-note.info { background: var(--accent-soft); }
.strip-note.info svg { color: var(--accent); }

.ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; color: var(--k); background: color-mix(in srgb, var(--k) 15%, transparent); }
.ico svg { width: 22px; height: 22px; }

/* allocation strip on home */
.strip { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
.strip i { display: block; height: 100%; background: var(--k); }
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 14px; }
.mini { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mini .ico { width: 34px; height: 34px; border-radius: 11px; }
.mini .ico svg { width: 18px; height: 18px; }
.mini div { min-width: 0; }
.mini span { display: block; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini b { font-size: .92rem; font-variant-numeric: tabular-nums; }
.mini.over b { color: var(--bad); }

/* trend */
.cmp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; margin-bottom: 8px; }
.delta { font-weight: 800; font-size: .78rem; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.delta.up { background: var(--bad-soft); color: var(--bad); }
.delta.down { background: var(--accent-soft); color: var(--accent); }
.delta.same { background: var(--sunk); color: var(--muted); }
.trend svg { display: block; width: 100%; height: auto; }
.trend text { font-family: var(--f-body); }
.trend g[data-ym] { cursor: pointer; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); margin-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px dashed var(--muted); }
.legend i.b { height: 10px; width: 10px; border: 0; border-radius: 3px; background: var(--accent); }

/* goals */
.goal { display: block; width: 100%; text-align: left; padding: 12px 0; }
.goal + .goal { border-top: 1px solid var(--line); }
.goal-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.goal-top b { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.goal-top span { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold-ink); white-space: nowrap; }
.goal .bar { margin: 8px 0 6px; height: 8px; }
.goal .bar i { background: linear-gradient(90deg, var(--accent), var(--gold)); }
.goal small { display: block; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.saved-total { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: .85rem; color: var(--muted); padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.saved-total b { color: var(--ink); font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.tips li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); font-size: .9rem; }
.tips li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--accent); }
.tips li.warn::before { background: var(--warn); }
.tips li.bad::before { background: var(--bad); }
.tips li.bad { background: var(--bad-soft); }
.tips li.warn { background: var(--warn-soft); }

.tx-list { list-style: none; margin: 0; padding: 0; }
.tx { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.tx + .tx { border-top: 1px solid var(--line); }
.tx .what { flex: 1; min-width: 0; }
.tx .what b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .what span { font-size: .8rem; color: var(--muted); }
.tx .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx .x { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; }
.tx .x.arm { background: var(--bad); color: #fff; width: auto; padding: 0 10px; font-size: .8rem; font-weight: 700; }
.tx .lock { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); opacity: .6; flex: none; }
.day-head { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); font-weight: 700; margin: 4px 4px 6px; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: .92rem; }
.empty svg { display: block; margin: 0 auto 8px; opacity: .5; }

/* history search */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 38px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: .82rem; font-weight: 700; white-space: nowrap; }
.fchip i { width: 8px; height: 8px; border-radius: 3px; background: var(--k); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* budget view */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 14px; padding: 3px; gap: 3px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button { padding: 9px 4px; border-radius: 11px; font-weight: 700; font-size: .85rem; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.preset-desc { color: var(--muted); font-size: .85rem; margin: 10px 2px 0; }
.custom-tag { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 6px; letter-spacing: 0; text-transform: none; }
.split-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
.split-legend b { color: var(--ink); }
.split-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; background: var(--k); }
.sum-pill { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; }
.sum-pill.off { background: var(--warn-soft); color: var(--warn); }
.sum-pill button { color: inherit; text-decoration: underline; font-weight: 800; }

.cat { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 12px; align-items: center; }
.cat + .cat { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.cat .name b { font-weight: 700; }
.cat .name span { display: block; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat .nom { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat .ctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.cat input[type=range] { flex: 1; min-width: 0; accent-color: var(--k); height: 28px; }
.cat input:disabled { opacity: .55; }
.pct { display: inline-flex; align-items: center; gap: 1px; background: var(--sunk); border-radius: 10px; padding: 4px 8px; font-weight: 700; }
.pct input { width: 2.6ch; border: 0; background: transparent; text-align: right; font-weight: 700; padding: 0; -moz-appearance: textfield; }
.pct input::-webkit-outer-spin-button, .pct input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.del { font-size: .78rem; color: var(--muted); padding: 6px 8px; border-radius: 9px; }
.del.arm { background: var(--bad); color: #fff; font-weight: 700; }
.cat .use { grid-column: 1 / -1; }
.bar { height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--k); border-radius: 999px; transition: width .3s; }
.use-txt { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.cat[data-state="warn"] .left { color: var(--warn); font-weight: 700; }
.cat[data-state="over"] .left { color: var(--bad); font-weight: 700; }
.cat[data-state="over"] .bar i { background: var(--bad); }
.add-row { display: flex; gap: 8px; margin-top: 16px; }
.field { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: 12px; padding: 11px 12px; }
.btn { background: var(--accent); color: var(--accent-ink); font-weight: 800; border-radius: 14px; padding: 13px 18px; white-space: nowrap; }
.btn.block { width: 100%; font-size: 1rem; padding: 15px; }
.btn.soft { background: var(--sunk); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }

/* settings */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row div { flex: 1; min-width: 0; }
.set-row b { display: block; font-weight: 600; }
.set-row span { font-size: .8rem; color: var(--muted); }
.badge { font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.steps { margin: 8px 0 0; padding-left: 20px; font-size: .9rem; }
.steps li { margin: 4px 0; }

/* install hint */
.install { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: .88rem; }
.install p { margin: 0; flex: 1; }
.install button { color: var(--muted); font-size: 1.2rem; width: 28px; height: 28px; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(10px, env(safe-area-inset-left, 0px));
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
}
.tabbar nav { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 700; color: var(--muted); padding: 6px 0 2px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { justify-self: center; width: 58px; height: 58px; border-radius: 20px; margin-top: -26px; background: linear-gradient(150deg, var(--note-a), var(--note-b)); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px -8px rgba(5,58,43,.8); }
.fab svg { width: 28px; height: 28px; }
.fab:active { transform: scale(.94); }

/* bottom sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4,14,10,.45); opacity: 0; transition: opacity .25s; }
.sheet {
  position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border-radius: 26px 26px 0 0; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(18px, env(safe-area-inset-left, 0px));
  -webkit-overflow-scrolling: touch;
}
.sheet.open { transform: none; }
.scrim.open { opacity: 1; }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { font-size: 1.35rem; margin-bottom: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sheet-head h2 { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.close { color: var(--muted); font-weight: 700; padding: 6px 4px; flex: none; }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 8px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.amount span { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; color: var(--muted); }
.amount input { width: 100%; max-width: 320px; border: 0; background: transparent; font-family: var(--f-display); font-weight: 800; font-size: 2.8rem; text-align: center; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; padding: 0; min-width: 0; }
.amount input:focus { outline: none; }
.chips { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 14px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; border: 2px solid transparent; background: var(--sunk); font-size: .72rem; font-weight: 700; text-align: center; line-height: 1.15; min-width: 0; }
.chip .ico { width: 36px; height: 36px; }
.chip[aria-checked="true"] { border-color: var(--k); background: color-mix(in srgb, var(--k) 10%, var(--surface)); }
.chip small { display: block; font-weight: 600; color: var(--muted); font-size: .66rem; font-variant-numeric: tabular-nums; }
.form-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-bottom: 14px; }
.form-grid label, .lbl-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.err { color: var(--bad); font-size: .85rem; min-height: 1.2em; margin: -6px 0 8px; text-align: center; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: -4px 0 14px; }
.quick button { background: var(--sunk); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; }
.goal-big { text-align: center; margin-bottom: 14px; }
.goal-big b { display: block; font-family: var(--f-display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal-big .bar { height: 10px; margin: 10px 0 6px; }
.goal-big .bar i { background: linear-gradient(90deg, var(--accent), var(--gold)); }
.goal-big small { color: var(--muted); font-size: .85rem; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick button { display: flex; justify-content: space-between; gap: 10px; text-align: left; padding: 14px; border-radius: 14px; background: var(--sunk); font-weight: 700; }
.pick button span { color: var(--muted); font-weight: 600; font-size: .85rem; white-space: nowrap; }

/* toast */
.toast { position: fixed; left: 50%; z-index: 40; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: .88rem; transition: .25s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* onboarding */
.onboard { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 18px;
  padding: calc(env(safe-area-inset-top, 0px) + 28px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px)); }
.ob-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ob-top .seg { width: 120px; }
.onboard .logo { width: 64px; height: 64px; border-radius: 18px; box-shadow: var(--shadow); }
.onboard h1 { font-size: 2.2rem; font-weight: 800; line-height: 1.05; }
.onboard p.lead { color: var(--muted); margin: 8px 0 0; font-size: 1rem; }
.ob-money { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.ob-money:focus-within { border-color: var(--accent); }
.ob-money span { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--muted); }
.ob-money input { border: 0; background: transparent; font-family: var(--f-display); font-weight: 800; font-size: 2.4rem; width: 100%; min-width: 0; padding: 0; font-variant-numeric: tabular-nums; }
.ob-money input:focus { outline: none; }
.ob-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.ob-cta { margin-top: auto; }

@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast, .bar i, .note .meter i { transition: none; } }
</style>
</head>
<body>

<!-- ===== onboarding (first run) ===== -->
<main class="onboard" id="onboard" hidden>
  <div class="ob-top">
    <img class="logo" src="apple-touch-icon.png" alt="">
    <div class="seg two" role="radiogroup" aria-label="Bahasa / Language" id="obLang"></div>
  </div>
  <div>
    <h1 data-i18n="ob.title"></h1>
    <p class="lead" data-i18n="ob.lead"></p>
  </div>
  <div>
    <label class="label" for="obIncome" data-i18n="ob.incomeLbl"></label>
    <div class="ob-money"><span>Rp</span><input id="obIncome" inputmode="numeric" autocomplete="off" placeholder="0"></div>
  </div>
  <div>
    <span class="label" id="obPresetLbl" data-i18n="budget.presetLbl"></span>
    <div class="seg" role="radiogroup" aria-labelledby="obPresetLbl" id="obPresets" style="margin-top:8px"></div>
    <p class="preset-desc" id="obDesc"></p>
  </div>
  <div class="card"><div class="ob-preview" id="obPreview"></div></div>
  <div class="ob-cta">
    <button class="btn block" id="obStart" type="button" data-i18n="ob.start"></button>
    <p class="err" id="obErr" style="margin-top:8px"></p>
  </div>
</main>

<!-- ===== app ===== -->
<div id="app" hidden>
  <div class="app">
    <header class="head">
      <div>
        <div class="sub" id="greet"></div>
        <h1 id="title"></h1>
      </div>
      <div class="month" data-i18n-aria="a.monthNav">
        <button id="prevM" type="button" data-i18n-aria="a.prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span id="monthLabel" class="num"></span>
        <button id="nextM" type="button" data-i18n-aria="a.next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </header>

    <div class="install" id="installHint" hidden>
      <p data-i18n-html="install.html"></p>
      <button type="button" id="installClose" data-i18n-aria="a.close">×</button>
    </div>

    <!-- HOME -->
    <section id="v-home" class="view">
      <div class="stack">
        <article class="note" id="note">
          <svg class="guil" id="guil" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
          <div class="note-top"><span class="label" id="hLbl"></span><span class="serial" id="serial">AU 000000</span></div>
          <div class="stamp" id="stamp" hidden data-i18n="stamp"></div>
          <div class="big" id="hLeft"><small>Rp</small>0</div>
          <div class="meter"><i id="hMeter"></i></div>
          <div class="note-cols">
            <button type="button" id="editIncome"><span class="label edit"><span data-i18n="hero.total"></span> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span><b id="hIncome">Rp 0</b></button>
            <div><span class="label" data-i18n="hero.spent"></span><b id="hSpent">Rp 0</b></div>
          </div>
          <div class="daily" id="hDaily"></div>
        </article>

        <div class="strip-note" id="graceNote" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span id="graceText"></span>
        </div>

        <div class="sec"><h2 data-i18n="sec.alloc"></h2><button class="link" type="button" data-go="budget" data-i18n="link.manage"></button></div>
        <div class="card">
          <div class="strip" id="homeStrip"></div>
          <div class="mini-grid" id="homeMini"></div>
        </div>

        <div class="sec"><h2 data-i18n="sec.trend"></h2></div>
        <div class="card trend">
          <div class="cmp" id="cmpLine"></div>
          <svg id="trendSvg" viewBox="0 0 320 150" role="img"></svg>
          <div class="legend"><span><i class="b"></i><span data-i18n="trend.bar"></span></span><span><i></i><span data-i18n="trend.line"></span></span></div>
        </div>

        <div class="sec"><h2 data-i18n="sec.goals"></h2><button class="link" type="button" id="newGoalLink" data-i18n="link.newGoal"></button></div>
        <div class="card" id="goalCard"></div>

        <div class="sec"><h2 data-i18n="sec.tips"></h2></div>
        <ul class="tips" id="tips"></ul>

        <div class="sec"><h2 data-i18n="sec.recent"></h2><button class="link" type="button" data-go="history" data-i18n="link.all"></button></div>
        <div class="card"><ul class="tx-list" id="recent"></ul></div>
      </div>
    </section>

    <!-- BUDGET -->
    <section id="v-budget" class="view" hidden>
      <div class="stack">
        <div class="strip-note" id="budgetNote" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span id="budgetNoteText"></span>
        </div>
        <div class="card">
          <span class="label" id="presetLbl"><span data-i18n="budget.presetLbl"></span><span class="custom-tag" id="customTag" hidden data-i18n="custom"></span></span>
          <div class="seg" role="radiogroup" aria-labelledby="presetLbl" id="presets" style="margin-top:8px"></div>
          <p class="preset-desc" id="presetDesc"></p>
          <div class="strip" id="splitStrip" style="margin-top:14px"></div>
          <div class="split-legend" id="splitLegend"></div>
          <div class="sum-pill" id="sumPill"></div>
        </div>
        <div class="card">
          <div id="catList"></div>
          <form class="add-row" id="addCatForm">
            <input class="field" id="newCat" maxlength="40" data-i18n-ph="budget.addPh" data-i18n-aria="budget.addPh">
            <button class="btn" type="submit" data-i18n="budget.add"></button>
          </form>
        </div>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="v-history" class="view" hidden>
      <div class="stack" style="gap:12px">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input class="field" type="search" id="hSearch" autocomplete="off" data-i18n-ph="hist.searchPh" data-i18n-aria="hist.searchPh">
        </div>
        <div class="filters" id="hFilters"></div>
        <div id="historyList" class="stack" style="gap:14px"></div>
      </div>
    </section>

    <!-- MORE -->
    <section id="v-more" class="view" hidden>
      <div class="stack">
        <div class="sec"><h2 data-i18n="more.language"></h2></div>
        <div class="card"><div class="seg two" role="radiogroup" aria-label="Bahasa / Language" id="langSeg"></div></div>

        <div class="sec"><h2 data-i18n="more.data"></h2></div>
        <div class="card">
          <div class="set-row"><div><b data-i18n="more.storage"></b><span id="storeInfo"></span></div><span class="badge" id="storeBadge">…</span></div>
          <div class="set-row"><div><b data-i18n="more.lastSaved"></b><span id="savedAt">–</span></div></div>
          <div class="set-row"><div><b data-i18n="more.lastBackup"></b><span id="backupAt"></span></div></div>
          <div class="set-row"><div><b data-i18n="more.savedTotal"></b><span id="savedSince"></span></div><b id="savedTotalMore" class="num"></b></div>
        </div>
        <div class="card stack" style="gap:10px">
          <button class="btn block" type="button" id="exportBtn" data-i18n="more.export"></button>
          <button class="btn block soft" type="button" id="importBtn" data-i18n="more.import"></button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
          <p class="preset-desc" style="margin:0" data-i18n="more.backupNote"></p>
        </div>

        <div class="sec"><h2 data-i18n="more.install"></h2></div>
        <div class="card"><ol class="steps" data-i18n-html="more.steps"></ol></div>

        <div class="sec"><h2 data-i18n="more.other"></h2></div>
        <div class="card">
          <button class="set-row" type="button" id="resetBtn" style="width:100%;text-align:left"><div><b style="color:var(--bad)" data-i18n="more.reset"></b><span data-i18n="more.resetSub"></span></div></button>
        </div>
        <p class="preset-desc" style="text-align:center" data-i18n="more.version"></p>
      </div>
    </section>
  </div>

  <div class="tabbar">
    <nav>
      <button class="tab" type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span data-i18n="tab.home"></span></button>
      <button class="tab" type="button" data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span data-i18n="tab.budget"></span></button>
      <button class="fab" type="button" id="fab" data-i18n-aria="a.add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tab" type="button" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span data-i18n="tab.history"></span></button>
      <button class="tab" type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span data-i18n="tab.more"></span></button>
    </nav>
  </div>
</div>

<!-- ===== sheets ===== -->
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sh-add" role="dialog" aria-modal="true" aria-labelledby="addTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="addTitle" data-i18n="a.add"></h2><button class="close" type="button" data-close data-i18n="btn.cancel"></button></div>
  <form id="addForm" novalidate>
    <div class="amount"><span>Rp</span><input id="addAmt" inputmode="numeric" autocomplete="off" placeholder="0" data-i18n-aria="add.amountAria"></div>
    <div class="quick" id="quickAmt"></div>
    <div class="chips" role="radiogroup" id="addCats"></div>
    <div class="form-grid">
      <label><span class="label" data-i18n="add.date"></span><input class="field" type="date" id="addDate"></label>
      <label><span class="label" data-i18n="add.note"></span><input class="field" id="addNote" maxlength="80" data-i18n-ph="add.notePh"></label>
    </div>
    <p class="err" id="addErr" role="alert"></p>
    <button class="btn block" type="submit" data-i18n="btn.save"></button>
  </form>
</section>

<section class="sheet" id="sh-income" role="dialog" aria-modal="true" aria-labelledby="incTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="incTitle" data-i18n="inc.title"></h2><button class="close" type="button" data-close data-i18n="btn.cancel"></button></div>
  <form id="incForm" novalidate>
    <div class="amount"><span>Rp</span><input id="incAmt" inputmode="numeric" autocomplete="off" placeholder="0" data-i18n-aria="inc.title"></div>
    <p class="preset-desc" style="text-align:center;margin:-4px 0 16px" data-i18n="inc.desc"></p>
    <button class="btn block" type="submit" data-i18n="btn.save"></button>
  </form>
</section>

<section class="sheet" id="sh-goal" role="dialog" aria-modal="true" aria-labelledby="goalNewTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="goalNewTitle" data-i18n="goal.new"></h2><button class="close" type="button" data-close data-i18n="btn.cancel"></button></div>
  <form id="goalForm" novalidate class="stack" style="gap:14px">
    <label class="lbl-field"><span class="label" data-i18n="goal.name"></span><input class="field" id="goalName" maxlength="40" data-i18n-ph="goal.namePh"></label>
    <label class="lbl-field"><span class="label" data-i18n="goal.amount"></span><input class="field num" id="goalAmt" inputmode="numeric" autocomplete="off" placeholder="6.000.000"></label>
    <p class="err" id="goalErr" role="alert" style="margin:0"></p>
    <button class="btn block" type="submit" data-i18n="btn.save"></button>
  </form>
</section>

<section class="sheet" id="sh-goal-detail" role="dialog" aria-modal="true" aria-labelledby="gdTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="gdTitle"></h2><button class="close" type="button" data-close data-i18n="a.close"></button></div>
  <div class="goal-big" id="gdBig"></div>
  <form id="depForm" novalidate>
    <span class="label" data-i18n="goal.depositLbl"></span>
    <div class="amount" style="margin-top:4px"><span>Rp</span><input id="depAmt" inputmode="numeric" autocomplete="off" placeholder="0" data-i18n-aria="goal.depositLbl"></div>
    <div class="quick" id="depQuick"></div>
    <p class="err" id="depErr" role="alert"></p>
    <button class="btn block" type="submit" data-i18n="goal.deposit"></button>
  </form>
  <div class="sec" style="margin:20px 0 6px"><h2 style="font-size:1.05rem;margin:0" data-i18n="goal.history"></h2></div>
  <ul class="tx-list" id="gdList"></ul>
  <button class="btn block soft" type="button" id="gdDelete" style="margin-top:14px;color:var(--bad)" data-i18n="goal.delete"></button>
</section>

<section class="sheet" id="sh-pick" role="dialog" aria-modal="true" aria-labelledby="pickTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="pickTitle" data-i18n="pick.title"></h2><button class="close" type="button" data-close data-i18n="btn.cancel"></button></div>
  <p id="pickText" style="margin:0 0 14px;color:var(--muted)"></p>
  <div class="pick" id="pickList"></div>
</section>

<section class="sheet" id="sh-confirm" role="dialog" aria-modal="true" aria-labelledby="cfTitle" hidden>
  <div class="grab"></div>
  <h2 id="cfTitle"></h2>
  <p id="cfText" style="margin:0 0 18px;color:var(--muted)"></p>
  <div class="stack" style="gap:10px">
    <button class="btn block danger" type="button" id="cfOk"></button>
    <button class="btn block soft" type="button" data-close data-i18n="btn.cancel"></button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ================= i18n =================
  const I18N = {

  const catName = c => BASE_IDS.has(c.id) ? t("cat." + c.id) : c.name;
  const catSub = c => BASE_IDS.has(c.id) ? t("sub." + c.id) : (c.sub || "");
  const LOCK_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  // ================= helpers =================
  const $ = id => document.getElementById(id);
  const rp = n => (n < 0 ? "-Rp " : "Rp ") + Math.abs(Math.round(n)).toLocaleString(loc());
  function rpShort(n) {
    const a = Math.abs(n), s = n < 0 ? "-" : "";
    const u = lang === "en" ? ["B", "M", "k"] : ["M", "jt", "rb"];
    const dec = x => { let v = x.toFixed(1).replace(/\.0$/, ""); return lang === "en" ? v : v.replace(".", ","); };
    const sp = lang === "en" ? "" : " ";
    if (a >= 1e9) return s + dec(a / 1e9) + sp + u[0];
    if (a >= 1e6) return s + dec(a / 1e6) + sp + u[1];
    if (a >= 1e3) return s + Math.round(a / 1e3) + sp + u[2];
    return s + Math.round(a);
  }
  const digits = s => Math.min(parseInt(String(s).replace(/\D/g, ""), 10) || 0, 999999999999);
  const grouped = n => n ? n.toLocaleString(loc()) : "";
  const clone = o => JSON.parse(JSON.stringify(o));
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const sum = arr => arr.reduce((a, b) => a + b, 0);

  // "Today" can be overridden with ?today=YYYY-MM-DD for testing the month lock.
  const TEST_TODAY = (() => { const v = new URLSearchParams(location.search).get("today"); return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null; })();
  function now() {
    const n = new Date();
    if (!TEST_TODAY) return n;
    const [y, m, d] = TEST_TODAY.split("-").map(Number);
    return new Date(y, m - 1, d, n.getHours(), n.getMinutes(), n.getSeconds());
  }
  const ymOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
  const isoOf = d => `${ymOf(d)}-${pad(d.getDate())}`;
  const curYm = () => ymOf(now());
  const dimOf = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const shiftYm = (ym, k) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + k, 1)); };
  const monthName = (ym, opt = { month: "long", year: "numeric" }) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(loc(), opt); };
  const monthShort = ym => monthName(ym, { month: "short", year: "numeric" });
  const fmtWhen = ts => ts ? new Date(ts).toLocaleString(loc(), { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";

  // ================= month lock =================
  // A month stays open for GRACE_DAYS days into the next month, then it is closed for good.
  const GRACE_DAYS = 3;
  function isLocked(ym) {
    const cur = curYm();
    if (ym >= cur) return false;
    if (shiftYm(ym, 1) < cur) return true;
    return now().getDate() > GRACE_DAYS;
  }
  const inGrace = ym => ym < curYm() && !isLocked(ym);
  const canEditBudget = ym => ym >= curYm();
  const graceEndText = ym => { const [y, m] = shiftYm(ym, 1).split("-").map(Number); return new Date(y, m - 1, GRACE_DAYS).toLocaleDateString(loc(), { day: "numeric", month: "long" }); };
  function earliestOpenDate() {
    const cur = curYm(), prev = shiftYm(cur, -1);
    return isLocked(prev) ? `${cur}-01` : `${prev}-01`;
  }

  // ================= data =================
  const defaultCats = key => BASE.map(b => ({ id: b.id, group: b.group, pct: PRESETS[key].p[b.id] }));
  const freshData = (income, preset) => ({
    v: 2, lang, settings: { income, preset, cats: defaultCats(preset) }, months: {}, tx: {}, goals: [],
    meta: { created: now().getTime(), lastBackup: 0 }, _t: 0,
  });
  function valid(d) {
    return d && typeof d === "object" && d.settings && Array.isArray(d.settings.cats) && typeof d.settings.income === "number" && d.tx && typeof d.tx === "object";
  }
  // v1 → v2: add per-month budget copies, goals and language. Months that already have
  // expenses get a copy of today's settings so later edits don't rewrite them.
  function migrate(d) {
    d.months = d.months && typeof d.months === "object" ? d.months : {};
    d.goals = Array.isArray(d.goals) ? d.goals : [];
    d.goals.forEach(g => { g.deposits = Array.isArray(g.deposits) ? g.deposits : []; });
    d.meta = d.meta || { created: now().getTime(), lastBackup: 0 };
    if (!d.lang) d.lang = d.v >= 2 ? lang : "id";
    for (const k of Object.keys(d.tx)) if (!Array.isArray(d.tx[k])) delete d.tx[k];
    d.v = 2;
    return d;
  }
  const snapshotOf = s => clone({ income: s.income, preset: s.preset, cats: s.cats });
  function ensureSnapshots() {
    if (!D) return false;
    const cur = curYm();
    let start = D.meta.created ? ymOf(new Date(D.meta.created)) : cur;
    for (const k of Object.keys(D.tx)) if (D.tx[k].length && k < start) start = k;
    let ym = start, changed = false, guard = 0;
    while (ym < cur && guard++ < 240) {
      if (!D.months[ym]) { D.months[ym] = snapshotOf(D.settings); changed = true; }
      ym = shiftYm(ym, 1);
    }
    if (changed) save();
    return changed;
  }
  const budgetFor = ym => (D.months && D.months[ym]) || D.settings;

  // ================= storage: IndexedDB + localStorage mirror =================
  // Every change is written to both. localStorage is synchronous, so a write made the moment
  // the app goes to background (pagehide / visibilitychange) is never lost; IndexedDB is the
  // larger, sturdier copy. On load the newer of the two (by _t) wins.
  const LS_KEY = "aturuang:data";
  let idb = null;
  const idbReady = new Promise(res => {
    try {
      const rq = indexedDB.open("aturuang", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onsuccess = () => { idb = rq.result; res(idb); };
      rq.onerror = () => res(null);
      rq.onblocked = () => res(null);
    } catch { res(null); }
  });
  function idbGet() {
    return idbReady.then(db => db && new Promise(res => {
      try { const r = db.transaction("kv").objectStore("kv").get("data"); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }
      catch { res(null); }
    }));
  }
  function idbPut(obj) {
    return idbReady.then(db => db && new Promise((res, rej) => {
      try { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(obj, "data"); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }
      catch (e) { rej(e); }
    }));
  }
  function lsGet() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }

  let D = null, dirty = false, saveTimer = 0, okLS = true, okIDB = true, persisted = null;

  function saveNow() {
    if (!D) return;
    clearTimeout(saveTimer);
    D._t = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(D)); okLS = true; } catch { okLS = false; }
    idbPut(clone(D)).then(() => { okIDB = true; }, () => { okIDB = false; }).finally(renderStoreInfo);
    dirty = false;
    if (!okLS && !idb) toast(t("toast.saveFail"));
  }
  function save() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); askPersist(); }
  const flushIfDirty = () => { if (dirty) saveNow(); };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushIfDirty(); });
  window.addEventListener("pagehide", flushIfDirty);
  window.addEventListener("beforeunload", flushIfDirty);

  let askedPersist = false;
  function askPersist() {
    if (askedPersist || !navigator.storage || !navigator.storage.persist) return;
    askedPersist = true;
    navigator.storage.persist().then(p => { persisted = p; renderStoreInfo(); }).catch(() => {});
  }

  async function load() {
    const a = lsGet();
    const b = await Promise.race([idbGet(), new Promise(r => setTimeout(() => r(null), 3000))]);
    const cands = [a, b].filter(valid).sort((x, y) => (y._t || 0) - (x._t || 0));
    return cands[0] || null;
  }

  // ================= view state & derived numbers =================
  let view = curYm(), tab = "home";

  const monthTx = (ym = view) => D.tx[ym] || [];
  const sumPct = (b = budgetFor(view)) => sum(b.cats.map(c => c.pct || 0));
  const allocOf = (c, b = budgetFor(view)) => Math.round(b.income * (c.pct || 0) / 100 / 1000) * 1000;
  const spentBy = (ym = view) => { const m = {}; for (const x of monthTx(ym)) m[x.cat] = (m[x.cat] || 0) + x.amt; return m; };
  function daysLeft() {
    const cur = curYm();
    if (view === cur) return dimOf(view) - now().getDate() + 1;
    return view < cur ? 0 : dimOf(view);
  }
  function findCat(id, ym = view) {
    return budgetFor(ym).cats.find(c => c.id === id) || D.settings.cats.find(c => c.id === id)
      || Object.values(D.months).map(m => m.cats.find(c => c.id === id)).find(Boolean) || null;
  }
  // Money kept from a finished month: total minus spending, where anything logged under a
  // savings-type category counts as kept, not spent.
  function savedOf(ym) {
    const b = budgetFor(ym);
    const spent = sum(monthTx(ym).filter(x => { const c = b.cats.find(k => k.id === x.cat); return !(c && c.group === "tabungan"); }).map(x => x.amt));
    return b.income - spent;
  }
  function totalSaved() {
    const months = Object.keys(D.tx).filter(ym => D.tx[ym].length && isLocked(ym)).sort();
    return { amt: sum(months.map(savedOf)), first: months[0] || null };
  }
  const goalSaved = g => sum(g.deposits.map(d => d.amt));
  function depositFrom(ym) {
    for (const g of D.goals) { const d = g.deposits.find(x => x.fromYm === ym); if (d) return { g, d }; }
    return null;
  }
  function savingsShare() {
    const c = D.settings.cats.find(k => k.id === "tabungan");
    return c ? allocOf(c, D.settings) : 0;
  }
  const windowSum = (ym, maxDay, catId) => sum(monthTx(ym).filter(x => (!maxDay || +x.date.slice(8) <= maxDay) && (!catId || x.cat === catId)).map(x => x.amt));

  // ================= toast / armable =================
  let toastT;
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200);
  }
  // Two-step destructive button: first tap arms, second tap within 3 s acts.
  function armable(btn, armText, act) {
    const orig = btn.innerHTML; let tm;
    btn.addEventListener("click", e => {
      e.stopPropagation();
      if (btn.classList.contains("arm")) { clearTimeout(tm); act(); return; }
      btn.classList.add("arm"); btn.textContent = armText;
      tm = setTimeout(() => { btn.classList.remove("arm"); btn.innerHTML = orig; }, 3000);
    });
  }

  // ================= banknote guilloché =================
  function drawGuilloche() {
    const svg = $("guil"); let out = "";
    const rose = (cx, cy, R, r, p, scale) => {
      let d = "";
      for (let i = 0; i <= 720; i++) {
        const a = i / 720 * Math.PI * 2;
        const x = cx + scale * ((R + r) * Math.cos(a) - p * Math.cos((R + r) / r * a));
        const y = cy + scale * ((R + r) * Math.sin(a) - p * Math.sin((R + r) / r * a));
        d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      return `<path d="${d}" fill="none" stroke="#fff" stroke-width=".6"/>`;
    };
    out += rose(330, 70, 40, 5, 9, 1.55) + rose(330, 70, 40, 5, 4, 1.15) + rose(330, 70, 30, 3, 6, 0.9);
    for (let k = 0; k < 9; k++) {
      let d = "";
      for (let x = -10; x <= 410; x += 4) {
        const y = 170 + k * 8 + Math.sin(x / 26 + k * .7) * 9 + Math.sin(x / 9) * 1.5;
        d += (x === -10 ? "M" : "L") + x + " " + y.toFixed(1);
      }
      out += `<path d="${d}" fill="none" stroke="#fff" stroke-width=".5"/>`;
    }
    svg.innerHTML = out;
  }

  // ================= language =================
  function renderLangSegs() {
    const html = ["id", "en"].map(l => `<button type="button" role="radio" data-l="${l}" aria-checked="${l === lang}">${l === "id" ? "Indonesia" : "English"}</button>`).join("");
    $("langSeg").innerHTML = html;
    $("obLang").innerHTML = ["id", "en"].map(l => `<button type="button" role="radio" data-l="${l}" aria-checked="${l === lang}">${l.toUpperCase()}</button>`).join("");
  }
  function setLang(l) {
    if (l !== "id" && l !== "en") return;
    lang = l;
    try { localStorage.setItem("aturuang:lang", l); } catch {}
    if (D) { D.lang = l; save(); }
    applyStatic(); renderLangSegs();
    if (D) { greet(); go(tab); renderAll(); } else renderOnboard();
  }
  $("langSeg").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b && b.dataset.l !== lang) { setLang(b.dataset.l); toast(t("toast.lang")); } });
  $("obLang").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) setLang(b.dataset.l); });

  // ================= onboarding =================
  let obPreset = "seimbang";
  function renderOnboard() {
    $("obPresets").innerHTML = Object.keys(PRESETS).map(k => `<button type="button" role="radio" data-p="${k}" aria-checked="${k === obPreset}">${t("preset." + k)}</button>`).join("");
    $("obDesc").textContent = t("pdesc." + obPreset);
    const inc = digits($("obIncome").value);
    $("obIncome").value = grouped(inc);
    $("obPreview").innerHTML = BASE.map(b => {
      const p = PRESETS[obPreset].p[b.id];
      const amt = Math.round(inc * p / 100 / 1000) * 1000;
      return `<div class="mini" style="--k:var(--c-${b.id})"><span class="ico">${icon(b)}</span><div><span>${esc(catName(b))} · ${p}%</span><b>${inc ? rp(amt) : "–"}</b></div></div>`;
    }).join("");
  }
  $("obIncome").addEventListener("input", renderOnboard);
  $("obPresets").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) { obPreset = b.dataset.p; renderOnboard(); } });
  $("obStart").addEventListener("click", () => {
    const inc = digits($("obIncome").value);
    if (!inc) { $("obErr").textContent = t("ob.err"); $("obIncome").focus(); return; }
    D = freshData(inc, obPreset);
    saveNow(); askPersist();
    showApp();
    toast(t("toast.ready"));
  });

  // ================= tabs & navigation =================
  const TABS = ["home", "budget", "history", "more"];
  function go(tb) {
    tab = tb;
    for (const k of TABS) $("v-" + k).hidden = k !== tb;
    document.querySelectorAll(".tab").forEach(b => {
      if (b.dataset.tab === tb) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("title").textContent = t("tab." + tb);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  $("prevM").addEventListener("click", () => { view = shiftYm(view, -1); renderAll(); });
  $("nextM").addEventListener("click", () => { view = shiftYm(view, 1); renderAll(); });

  // ================= sheets =================
  let openSheet = null;
  function sheet(id) {
    closeSheet(true);
    const s = $(id), sc = $("scrim");
    s.hidden = false; sc.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { s.classList.add("open"); sc.classList.add("open"); }));
    openSheet = s;
  }
  function closeSheet(instant) {
    if (!openSheet) return;
    const s = openSheet, sc = $("scrim");
    s.classList.remove("open"); sc.classList.remove("open");
    openSheet = null;
    const done = () => { if (!s.classList.contains("open")) { s.hidden = true; if (!openSheet) sc.hidden = true; } };
    instant ? done() : setTimeout(done, 280);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $("scrim").addEventListener("click", () => closeSheet());
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeSheet()));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  // drag the sheet down by its top to close
  document.querySelectorAll(".sheet").forEach(s => {
    let y0 = null, dy = 0;
    s.addEventListener("touchstart", e => { if (s.scrollTop <= 0 && e.target.closest(".grab, .sheet-head, h2")) { y0 = e.touches[0].clientY; dy = 0; s.style.transition = "none"; } }, { passive: true });
    s.addEventListener("touchmove", e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); s.style.transform = `translateY(${dy}px)`; }, { passive: true });
    s.addEventListener("touchend", () => { if (y0 == null) return; s.style.transition = ""; s.style.transform = ""; if (dy > 90) closeSheet(); y0 = null; });
  });

  let confirmAct = null;
  function confirmSheet(title, text, okText, act) {
    $("cfTitle").textContent = title; $("cfText").textContent = text; $("cfOk").textContent = okText;
    confirmAct = act; sheet("sh-confirm");
  }
  $("cfOk").addEventListener("click", () => { const a = confirmAct; confirmAct = null; closeSheet(); if (a) a(); });

  // ================= expenses: add / delete (lock-guarded) =================
  function addTx(entry) {
    const ym = entry.date.slice(0, 7);
    if (isLocked(ym)) { toast(t("toast.locked")); return false; }
    (D.tx[ym] = D.tx[ym] || []).push(entry);
    save(); return true;
  }
  function deleteTx(entry) {
    const ym = entry.date.slice(0, 7);
    if (isLocked(ym)) { toast(t("toast.locked")); return; }
    D.tx[ym] = (D.tx[ym] || []).filter(x => x !== entry);
    save(); renderAll(); toast(t("toast.txDeleted"));
  }

  let addCat = null;
  const addYm = () => ($("addDate").value || isoOf(now())).slice(0, 7);
  function openAdd() {
    if (!D.settings.cats.length) { toast(t("toast.needCat")); go("budget"); return; }
    const cur = curYm(), open = earliestOpenDate();
    $("addAmt").value = ""; $("addNote").value = ""; $("addErr").textContent = "";
    $("addDate").min = open;
    // default date: today, or the end of an earlier month that is still open, or the 1st of a future month
    $("addDate").value = view === cur || isLocked(view) || view < open.slice(0, 7) ? isoOf(now())
      : view < cur ? `${view}-${pad(dimOf(view))}` : `${view}-01`;
    renderAddCats();
    $("quickAmt").innerHTML = [10000, 20000, 50000, 100000].map(v => `<button type="button" data-v="${v}">${rpShort(v)}</button>`).join("");
    sheet("sh-add");
    setTimeout(() => $("addAmt").focus(), 320);
  }
  function renderAddCats() {
    const ym = addYm(), b = budgetFor(ym), spent = spentBy(ym);
    if (!b.cats.some(c => c.id === addCat)) addCat = b.cats[0] && b.cats[0].id;
    $("addCats").innerHTML = b.cats.map(c => {
      const left = allocOf(c, b) - (spent[c.id] || 0);
      return `<button type="button" class="chip" role="radio" data-c="${esc(c.id)}" aria-checked="${c.id === addCat}" style="--k:${colorOf(c)}"><span class="ico">${icon(c)}</span>${esc(catName(c))}<small>${esc(t("add.left", { amt: rpShort(left) }))}</small></button>`;
    }).join("");
  }
  $("addDate").addEventListener("change", renderAddCats);
  $("addCats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { addCat = b.dataset.c; renderAddCats(); } });
  $("quickAmt").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) $("addAmt").value = grouped(digits($("addAmt").value) + +b.dataset.v); });
  $("addAmt").addEventListener("input", e => { e.target.value = grouped(digits(e.target.value)); });
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const amt = digits($("addAmt").value), date = $("addDate").value;
    const err = $("addErr");
    if (!amt) { err.textContent = t("err.amt"); $("addAmt").focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = t("err.date"); return; }
    const ym = date.slice(0, 7);
    if (isLocked(ym) || date < earliestOpenDate()) {
      const open = earliestOpenDate(), [y, m, d] = open.split("-").map(Number);
      err.textContent = t("err.locked", { month: monthName(ym), date: new Date(y, m - 1, d).toLocaleDateString(loc(), { day: "numeric", month: "long" }) });
      return;
    }
    const c = budgetFor(ym).cats.find(k => k.id === addCat);
    if (!c) { err.textContent = t("err.cat"); return; }
    if (!addTx({ id: uid(), date, cat: c.id, amt, note: $("addNote").value.trim(), t: Date.now() })) return;
    closeSheet();
    view = ym;
    renderAll();
    toast(t("toast.added", { amt: rp(amt), cat: catName(c) }));
  });
  $("fab").addEventListener("click", openAdd);

  // ---- income sheet ----
  $("editIncome").addEventListener("click", () => {
    if (!canEditBudget(view)) { toast(t("toast.locked")); return; }
    $("incAmt").value = grouped(D.settings.income); sheet("sh-income"); setTimeout(() => $("incAmt").focus(), 320);
  });
  $("incAmt").addEventListener("input", e => { e.target.value = grouped(digits(e.target.value)); });
  $("incForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!canEditBudget(view)) return;
    D.settings.income = digits($("incAmt").value);
    save(); closeSheet(); renderAll(); toast(t("toast.income"));
  });

  // ================= render: home =================
  const emptyHtml = text => `<li class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z"/><path d="M4 7l2-3h12l2 3M9 12h6"/></svg>${esc(text)}</li>`;

  function renderHero() {
    const b = budgetFor(view), spent = spentBy(), dl = daysLeft(), cur = curYm();
    const total = sum(Object.values(spent));
    const past = view < cur, note = $("note");
    let value, label;
    if (past) { const s = savedOf(view); value = s; label = s >= 0 ? t("hero.saved") : t("hero.over"); }
    else { value = b.income - total; label = view > cur ? t("hero.leftFuture") : t("hero.left"); }
    note.classList.toggle("neg", value < 0);
    $("hLbl").textContent = label;
    $("hLeft").innerHTML = `<small>${value < 0 && !past ? "-Rp" : "Rp"}</small>${Math.abs(value).toLocaleString(loc())}`;
    $("hIncome").textContent = rp(b.income);
    $("hSpent").textContent = rp(total);
    $("hMeter").style.width = (b.income ? Math.min(100, total / b.income * 100) : 0) + "%";
    $("serial").textContent = "AU " + view.replace("-", "") + " · " + monthName(view, { month: "short" }).toUpperCase();
    $("stamp").hidden = !isLocked(view);
    $("serial").style.visibility = isLocked(view) ? "hidden" : "";
    $("editIncome").disabled = !canEditBudget(view);

    const row = $("hDaily");
    if (!past) {
      const flex = sum(b.cats.filter(c => c.group !== "tabungan" && c.id !== "tagihan").map(c => Math.max(0, allocOf(c, b) - (spent[c.id] || 0))));
      const lbl = view === cur ? t("hero.safeToday", { n: dl }) : t("hero.avgDay", { n: dl });
      row.innerHTML = `<span>${esc(lbl)}</span><b>${rp(dl ? flex / dl : 0)}</b>`;
      return;
    }
    const s = savedOf(view);
    if (!monthTx().length) row.innerHTML = `<span>${esc(t("hero.noTx"))}</span>`;
    else if (s <= 0) row.innerHTML = `<span>${esc(t("hero.overNote"))}</span>`;
    else if (!isLocked(view)) row.innerHTML = `<span>${esc(t("hero.finalAfter", { date: graceEndText(view) }))}</span>`;
    else {
      const dep = depositFrom(view);
      if (dep) row.innerHTML = `<span>${esc(t("hero.inGoal", { name: dep.g.name }))}</span>`;
      else if (!D.goals.length) row.innerHTML = `<button type="button" data-act="newgoal">${esc(t("hero.makeGoal"))}</button>`;
      else row.innerHTML = `<button type="button" data-act="togoal">${esc(t("hero.toGoal"))}</button>`;
    }
  }
  $("hDaily").addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "newgoal") openNewGoal();
    else openPick(view);
  });

  function renderGrace() {
    const prev = shiftYm(curYm(), -1);
    const show = inGrace(prev);
    $("graceNote").hidden = !show;
    if (show) $("graceText").textContent = t("grace.note", { month: monthName(prev, { month: "long" }), date: graceEndText(prev) });
  }

  function renderHome() {
    renderHero(); renderGrace();
    const b = budgetFor(view), spent = spentBy(), dl = daysLeft();
    const tp = Math.max(100, sumPct(b));
    $("homeStrip").innerHTML = b.cats.filter(c => c.pct).map(c => `<i style="--k:${colorOf(c)};width:${c.pct / tp * 100}%"></i>`).join("");
    $("homeMini").innerHTML = b.cats.map(c => {
      const a = allocOf(c, b), s = spent[c.id] || 0;
      return `<div class="mini${s > a ? " over" : ""}" style="--k:${colorOf(c)}"><span class="ico">${icon(c)}</span><div><span>${esc(catName(c))}</span><b>${rp(a - s)}</b></div></div>`;
    }).join("");

    renderTrend(); renderGoals(); renderTips(spent, dl);

    const items = [...monthTx()].sort((x, y) => y.date.localeCompare(x.date) || (y.t || 0) - (x.t || 0)).slice(0, 5);
    const ul = $("recent");

    ul.innerHTML = ""; items.forEach(x => ul.appendChild(txItem(x)));

  function txItem(x, withYear) {
    const ym = x.date.slice(0, 7);
    const c = findCat(x.cat, ym) || { id: "x", name: t("tx.deletedCat"), color: "--c-x4" };
    const li = document.createElement("li");
    li.className = "tx";
    li.style.setProperty("--k", colorOf(c));
    const d = new Date(x.date + "T00:00:00");
    const locked = isLocked(ym);
    li.innerHTML = `<span class="ico">${icon(c)}</span><div class="what"><b></b><span></span></div><span class="amt">-${rp(x.amt)}</span>` +
      (locked ? `<span class="lock" title="${esc(t("tx.locked"))}" aria-label="${esc(t("tx.locked"))}">${LOCK_SVG}</span>`
              : `<button type="button" class="x" aria-label="${esc(t("del"))}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`);
    li.querySelector("b").textContent = x.note || catName(c);
    li.querySelector(".what span").textContent = (x.note ? catName(c) + " · " : "") + d.toLocaleDateString(loc(), withYear ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" });
    if (!locked) armable(li.querySelector(".x"), t("del"), () => deleteTx(x));
    return li;
